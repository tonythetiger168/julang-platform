  The published repo ships src/js/*.js and src/assets/* but no HTML/CSS at all.

<!-- error capture: lets a headless run report console/JS failures in the DOM -->
<script>
window.__errs = [];
window.__logs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || 'error') + ' @' + (e.filename || '?') + ':' + (e.lineno || 0));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('unhandledrejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
// capture console output so a headless dump can report it
['log', 'warn', 'error'].forEach(function (kind) {
  var orig = console[kind].bind(console);
  console[kind] = function () {
    try {
      if (window.__logs.length < 40) {
        window.__logs.push(kind + ': ' + Array.prototype.map.call(arguments, String).join(' ').slice(0, 180));
      }
    } catch (_) {}
    orig.apply(null, arguments);
  };
});
</script>

<!-- ---------- player ---------- -->
<div id="player-modal" class="fixed inset-0 z-50 hidden bg-black/90 p-3">
  <div class="w-full max-w-3xl space-y-3">
    <!-- 舊標題列（片名／集數總數／金幣／⛶／關閉）。v7.6 直式滿版（.player-immersive）
         時整列隱藏，改由覆蓋在畫面上的 #player-top-bar 提供返回／選集／倍速／⋮；
         這幾個 id 仍留在 DOM（ui.js 會寫入文字），只是不佔版面。 -->
    <div id="player-head" class="flex items-center gap-2">
      <div id="player-title" class="flex-1 font-bold"></div>
      <div id="player-ep-total" class="text-xs text-white/50"></div>
      <div class="flex items-center gap-1 text-xs text-amber-300">🪙 <span id="coin-amount">0</span></div>
      <button class="w-8 h-8 rounded-lg bg-white/10 text-xs active:scale-95" onclick="toggleFullscreen()" title="全螢幕（橫屏觀看）" aria-label="全螢幕">⛶</button>
      <button class="px-3 py-1 rounded-lg bg-white/10 text-xs" onclick="closePlayer()">關閉</button>
    </div>
    <!-- 頂列（DramaBox 型）：‹ 返回 ＋ 第 N 集 ＋ 倍速（真的改 playbackRate）＋ ⋮。
         `‹` 關掉播放器＝回到上一頁（播放器本身就是全螢幕覆蓋層）；
         `第 N 集` 直接開選集 sheet（與右側「選集」同一條路，不另做一套）。
         v7.6.2：**預設 hidden**（使用者：「全部預設隱藏、點畫面才出現」）。
         頂列／右側操作列／底部列是**同一組**，由 player-rail.js 的 railShow/railHide
         一起切換（點影片 = toggle），三者永遠同步。 -->
    <div id="player-top-bar" class="hidden">
      <button id="rail-back" type="button" class="top-bar-btn" onclick="closePlayer()" aria-label="返回">‹</button>
      <button id="rail-episode-chip" type="button" class="top-bar-btn" onclick="railTogglePicker()" aria-haspopup="dialog" title="選集">第 1 集</button>
      <div class="flex-1"></div>
      <button id="rail-speed" type="button" class="top-bar-btn" onclick="railToggleSpeed()" aria-haspopup="menu" aria-expanded="false" title="播放速度">1.0×</button>
      <!-- v7.6.2：⋮ 開「播放設置」面板（解析度／倍速／彈幕／畫中畫），不再是只有觀看數的小選單 -->
      <button id="rail-more" type="button" class="top-bar-btn" onclick="railToggleSettings()" aria-haspopup="dialog" aria-expanded="false" aria-label="播放設置">⋮</button>
    </div>
    <!-- 播放區：比例由**影片自己**決定（v7.4）。容器不再寫死 aspect-video（16:9），
         那會把直式成片（720×1280）壓扁；player.js 在 loadedmetadata 讀
         videoWidth/videoHeight 後寫入 --jl-video-aspect / --jl-video-ratio，
         styles.css 的 #player-video 規則用它算出框的比例與高度上限。
         v7.6.2：右側操作列改成 DramaBox 版型 —— **線性圖示 + 下方數字/文字**、
         沒有膠囊底。數字是**真的**：收藏＝UserFollow 的實際人數（後端 followCount）、
         留言＝Comment 的實際則數（commentCount）；拿不到就整行不顯示，不編 0。
         預設 hidden（與頂列／底部列同一組，點畫面一起 toggle）。
         它放在 #player-video-home 內（該節點是定位基準），所以永遠貼齊畫面右緣；
         全螢幕時 player-rail.js 會把它搬進 Artplayer 的容器，離開時搬回來。 -->
    <div id="player-video-home">
      <div id="player-video" class="w-full bg-black rounded-xl overflow-hidden"></div>
      <div id="player-rail" class="hidden" role="toolbar" aria-label="播放操作" aria-orientation="vertical">
        <button id="rail-follow" type="button" class="rail-btn" onclick="railToggleFollow()" aria-pressed="false" title="加入追劇">
          <span class="rail-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.8h11a1 1 0 0 1 1 1v15.4l-6.5-3.8-6.5 3.8V4.8a1 1 0 0 1 1-1z"/></svg></span>
          <span id="rail-follow-count" class="rail-cap">0</span>
        </button>
        <button id="rail-comment" type="button" class="rail-btn" onclick="railComment()" title="留言">
          <span class="rail-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.2 8.2 0 0 1-8.8 8.1 9 9 0 0 1-3.2-.6L3.5 21l1.6-4.9a7.9 7.9 0 0 1-.7-3.3 8.2 8.2 0 0 1 8.8-8.1 8.2 8.2 0 0 1 7.3 6.9z"/></svg></span>
          <span id="rail-comment-count" class="rail-cap">0</span>
        </button>
        <button id="rail-picker" type="button" class="rail-btn" onclick="railTogglePicker()" aria-expanded="false" aria-haspopup="dialog" title="選集">
          <span class="rail-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h11M4 12h11M4 17.5h7"/><path d="M18 10.5v7l5-3.5z"/></svg></span>
          <span class="rail-cap">選集</span>
        </button>
        <button id="rail-share" type="button" class="rail-btn" onclick="railShare()" aria-haspopup="dialog" title="分享本集">
          <span class="rail-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5v6.7a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-6.7"/><path d="M12 15.2V3.6"/><path d="M8.2 7.4 12 3.6l3.8 3.8"/></svg></span>
          <span class="rail-cap">分享</span>
        </button>
      </div>
      <!-- 倍速選單（頂列的「1.0×」打開；真的改 artPlayer.playbackRate）。
           v7.6.2：原本的 #rail-more-menu 已由「播放設置」sheet 取代（⋮ 改開那張）。 -->
      <div id="rail-speed-menu" class="rail-menu hidden" role="menu" aria-label="播放速度"></div>
    </div>
    <!-- 底部列（DramaBox 型）：左＝開通會員、右＝下載（原本在下載在右側操作列，重複故移除）。
         下載＝<a download>（同源 MP4 由瀏覽器原生下載）。href 與 download **只在該集可播放時**
         才由 player-rail.js 寫上；鎖住的集數（契約：videoUrl 為 null）連 href 都沒有，
         所以不可能下載到付費內容。
         v7.6.2：**預設 hidden**（使用者：「在影片視窗下固定隱藏、點擊顯示出來」），
         與頂列／右側操作列同一組，點畫面一起出現、再點一起收起。 -->
    <div id="player-bottom-bar" class="hidden">
      <button id="bottom-membership" type="button" class="bottom-bar-btn" onclick="switchTab('inspire')" title="開通會員">✓ 開通會員</button>

         倍速真的改 artPlayer.playbackRate、畫中畫真的切 artPlayer.pip；

    <div id="rail-settings-sheet" class="rail-sheet hidden" role="dialog" aria-modal="true" aria-label="播放設置">

<!-- Compatibility shims: the bundle calls these but never defines them.
     ui.js openPlayer() calls updateFollowBtn() BEFORE showing the player, so
     without a stub every card tap throws and the player never opens. -->
<script>
  // Compatibility shims: the bundle calls these but never defines them.
  // ui.js openPlayer() calls updateFollowBtn() BEFORE showing the player, so
  // without a stub every card tap throws and the player never opens.
  if (typeof window.updateFollowBtn !== 'function') window.updateFollowBtn = function () {};
  if (typeof window.toggleFollow !== 'function') window.toggleFollow = function () {};

  // 紅果-style top strip: genres go through the app's own search; anything the
  // demo data cannot serve says so instead of pretending to filter.
  window.homeChip = function (btn, term, label) {
    var all = document.querySelectorAll('#home-chips .chip');
    for (var i = 0; i < all.length; i++) {
      if (all[i] === btn) all[i].classList.add('chip-active');
      else all[i].classList.remove('chip-active');
    }
    if (term === '__feed') { var v = document.getElementById('view-feed'); if (v) v.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (term === '__unsupported') { if (window.showToast) showToast('Demo 資料未提供「' + label + '」篩選'); return; }
    if (typeof window.quickSearch === 'function') quickSearch(term);
  };

  // 紅果/DramaBox share the same idea here: a scrollable genre strip above the
  // feed. The taxonomy comes from the demo data layer so it is defined once.
  (function () {
    var strip = document.getElementById('home-chips');
    var genres = window.__genreList || [];
    if (!strip || !genres.length) return;
    for (var i = 0; i < genres.length; i++) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = genres[i].name;
      b.setAttribute('onclick', "homeChip(this,'" + genres[i].name + "')");
      strip.appendChild(b);
    }
  })();

  // mirror the header balance into the 福利 card
  (function () {
    var cc = document.getElementById('coin-count');
    var wc = document.getElementById('welfare-coins');
    if (!cc || !wc) return;
    wc.textContent = cc.textContent;
    if (window.MutationObserver) {
      new MutationObserver(function () { wc.textContent = cc.textContent; })
        .observe(cc, { childList: true, characterData: true, subtree: true });
    }
  })();
</script>

<script>
  // Diagnostics (reconstruction only, observational): records page errors and
  // console output, then writes a snapshot into #__diag for headless inspection.
  document.addEventListener('DOMContentLoaded', function () {
    // deep link: #feed #theater #welfare #manju #follow #rank
    var hash = (location.hash || '').replace(/^#/, '');
    var play = hash.match(/^play=(.+)$/);
    if (play) {
      try { openPlayer(play[1]); } catch (e) { window.__errs.push('openPlayer: ' + e.message); }
    } else {
      var target = hash === 'welfare' ? 'inspire' : (hash || 'feed');
      try { switchTab(target); } catch (e) { window.__errs.push('switchTab: ' + e.message); }
    }
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var d = document.getElementById('__diag');
      var feed = document.getElementById('feed-container');
      var rect = function (el) {
        if (!el) return null;
        var r = el.getBoundingClientRect();
        return [Math.round(r.x), Math.round(r.width)];
      };
      var navItems = [].map.call(document.querySelectorAll('.nav-item'), function (b) {
        return Math.round(b.getBoundingClientRect().x);
      });
      d.textContent = 'DIAG ' + JSON.stringify({
        errors: window.__errs,
        logs: window.__logs.slice(-12),
        layout: {
          innerW: window.innerWidth,
          docScrollW: document.documentElement.scrollWidth,
          bodyW: Math.round(document.body.getBoundingClientRect().width),
          header: rect(document.querySelector('header')),
          nav: rect(document.querySelector('nav')),
          navItemX: navItems,
          stage: rect(feed ? feed.firstElementChild && feed.firstElementChild.firstElementChild : null),
        },
        video: (function () {
          var v = document.querySelector('#player-video video');
          if (!v) return null;
          return {
            src: String(v.currentSrc || v.src || '').slice(0, 90),
            readyState: v.readyState,
            duration: Math.round(v.duration || 0),
            paused: v.paused,
            error: v.error ? v.error.code : null
          };
        })(),
        feedChildren: feed ? feed.children.length : -1,
        feedCards: feed ? (feed.innerHTML.match(/snap-start/g) || []).length : -1,
        theaterChildren: document.getElementById('theater-grid').children.length,
        rankChildren: document.getElementById('rank-list').children.length,
        tailwind: !!window.tailwind,
        artplayer: typeof window.Artplayer,
        hls: typeof window.Hls,
        apiPatched: !!(window.api && window.api.request && String(window.api.request).indexOf('Math.random') !== -1)
      });
    }, 2500);
  });
</script>
